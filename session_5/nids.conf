# nids.conf -- umbrales de deteccion (una pareja clave = valor por linea)
# Las lineas que empiezan por # y las vacias se ignoran; una clave desconocida es un error.
# Sesion 5: umbrales que cazaron los ataques de la sesion 4
# (los valores originales estan en nids.s4.conf).

# portscan: muchos puertos distintos Y muchos SYN
portscan_ports = 10
portscan_syns = 10

# sweep: muchos hosts distintos Y muchos SYN
sweep_hosts = 20
sweep_syns = 20

# synflood: muchos SYN sin respuesta hacia POCOS puertos
synflood_unanswered = 100
synflood_max_ports = 10

# beacon: >= conns conexiones, periodo medio >= period s, regularidad cv <= max
beacon_min_conns = 8
beacon_min_period = 10
beacon_max_cv = 0.30
